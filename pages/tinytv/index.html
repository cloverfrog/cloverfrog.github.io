<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinyTV · 固定频道</title>
<link rel="stylesheet" href="style.css">
<main>
  <header><a href="../../">cloverfrog</a><span>LIVE · TINY</span></header>
  <h1>TinyTV</h1><p>打开电视，看看现在播到哪里。</p>
  <button id="logout" hidden>退出登录</button>
  <section id="player" aria-label="频道播放器">
    <video id="video" playsinline preload="metadata" disablepictureinpicture disableremoteplayback></video>
    <div class="bar"><button id="enter">进入频道</button><button id="fullscreen">全屏</button><span id="status" role="status">正在连接频道…</span></div>
  </section>
  <h2 id="current">等待节目</h2><p id="next"></p>
  <h3>循环节目单</h3><ol id="programs"></ol>
</main><script type="module" src="player.js"></script>
</html>
